<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Survey</title>
  </head>
  <body>
    <header class="survey-header">
      <h1 class="survey-title">Survey</h1>
      <p class="survey-tagline">Step-free entrance checks for OpenStreetMap.</p>
    </header>
    <div id="handoff" class="qt qt-handoff" hidden>
      <span class="qt-handoff-origin" aria-hidden="true"></span>
      <span id="handoff-text">Carried from Quest</span>
      <span class="qt-handoff-time" id="handoff-time"></span>
    </div>
    <main class="survey-layout">
      <section class="survey-main" id="work" aria-live="polite"></section>
      <aside id="rack"></aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
